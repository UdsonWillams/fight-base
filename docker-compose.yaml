  #   container_name: frontend
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - fight_base_network
  #   restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    depends_on:
      - database
    networks:
      - fight_base_network
    env_file: ".env"
    environment:
      - POSTGRES_HOST=database
    restart: on-failure
    volumes:
      - .:/code

  database:
    image: postgres:15
    container_name: fight_base_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: fight_base
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fight_base_network

  redis:
    image: redis:7-alpine
    container_name: fight_base_redis
    ports:
      - "6379:6379"
    networks:
      - fight_base_network


volumes:
  dbdata:
  postgres_data:

networks:
  fight_base_network:
